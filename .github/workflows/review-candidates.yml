name: Review candidates (admin)

# Applies the admin's Accept/Reject decisions on pending papers, dispatched
# from the site's admin "Review new papers" modal (or run manually here).
# Partial decisions are fine — undecided papers stay in the queue.
# Accept -> paper goes live + queued for the survey update feed.
# Reject -> removed + blacklisted (never auto-suggested again).
# The result is opened as a PULL REQUEST: merge to finalize, close to discard.

on:
  workflow_dispatch:
    inputs:
      accept:
        description: "Paper ids to ACCEPT (publish)"
        required: false
        default: ""
      reject:
        description: "Paper ids to REJECT (remove + blacklist)"
        required: false
        default: ""
      clear_queue:
        description: "Set 'true' to clear the update-survey queue"
        required: false
        default: "false"
      queue_remove:
        description: "Paper ids to EXCLUDE from the survey update (drop from the queue)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply review decisions
        id: rev
        env:
          FC_ACCEPT: ${{ inputs.accept }}
          FC_REJECT: ${{ inputs.reject }}
          FC_CLEAR_QUEUE: ${{ inputs.clear_queue }}
          FC_QUEUE_REMOVE: ${{ inputs.queue_remove }}
        run: python scripts/review_candidates.py
      - name: Open pull request
        if: steps.rev.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/admin-review
          title: "\u2705 Admin review: ${{ steps.rev.outputs.summary }}"
          body-path: review_summary.md
          labels: data-correction, automated
          commit-message: "Admin review: ${{ steps.rev.outputs.summary }}"
          add-paths: |
            data/papers.json
            data/blacklist.json
            survey/new_papers_queue.json
          delete-branch: true
