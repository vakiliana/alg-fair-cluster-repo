name: Survey — mark AI section reviewed (admin)

# Marks an AI-drafted survey section as author-reviewed and SCRUBS every
# AI-generated label for it (web banner/tag in survey/content.html, the
# % AI-DRAFTED comments + \aibanner in the LaTeX, renames ai-*.tex, and the
# provenance box), then opens a PULL REQUEST for the maintainer to merge
# (accept) or close (reject). Triggered from the survey admin UI (which calls
# the GitHub API) or manually from this Actions page. Collaborator-only.

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Which AI section to mark reviewed"
        required: true
        type: choice
        default: all
        options:
          - all
          - abstract
          - preliminaries
          - proportionality
          - techniques
          - future-directions
          - fig-taxonomy
          - tab-results
      reviewed:
        description: "Reviewed? (untick to restore the pending flag)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrub AI labels
        id: rev
        env:
          FC_SECTION: ${{ inputs.section }}
          FC_REVIEWED: ${{ inputs.reviewed }}
        run: python scripts/survey_review.py

      - name: Open pull request
        if: steps.rev.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/survey-review
          title: "✅ Survey: mark ${{ inputs.section }} as author-reviewed"
          body-path: review_summary.md
          labels: survey-feedback, automated
          commit-message: "Survey review: ${{ inputs.section }} (scrub AI labels)"
          add-paths: |
            survey/**
          delete-branch: true
