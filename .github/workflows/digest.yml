name: Maintenance digest (monthly)

# Compiles everything awaiting review (submissions, corrections, new-tag
# proposals) plus recent discovery/citation PRs into one summary issue you
# get notified about. Optionally emails it too (see the commented step).

on:
  schedule:
    # 07:00 UTC on the 2nd — the day after the monthly discovery + citation runs.
    - cron: "0 7 2 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & post digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Set to your GitHub username to get the digest issue assigned to you:
          DIGEST_ASSIGNEE: ""
        run: python scripts/digest.py

      # --- Optional email delivery -------------------------------------------
      # Uncomment and add the SMTP_* secrets to also receive the digest by email.
