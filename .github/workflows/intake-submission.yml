name: Intake paper submission

# When a user submits a missing paper via the site (a "[paper] …" issue),
# parse it and queue it as a pending-review record in data/papers.json so it
# shows up in the admin's in-site Review queue — the same flow as papers
# found by the discovery bot. The issue gets a confirmation comment.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: startsWith(github.event.issue.title, '[paper]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Queue for admin review
        id: q
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/intake_submission.py
      - name: Commit
        if: steps.q.outputs.changed == 'true'
        run: |
          git config user.name  "fair-clustering-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Queue user-submitted paper for admin review (issue #${{ github.event.issue.number }})"
          git push
