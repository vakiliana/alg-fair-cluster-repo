name: Discover new papers (monthly)

# Scans arXiv + DBLP for new fair-clustering papers (skipping anything on the
# blacklist) and commits them to data/papers.json with status
# "pending-review". Pending papers are ONLY visible in the site's admin mode,
# in the "Review new papers" queue, where the admin Accepts (publish) or
# Rejects (blacklist) each one — so no PR is needed here.

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}        # run on demand from the Actions tab

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for new papers
        id: scan
        run: python scripts/discover.py

      - name: Commit candidates for admin review
        if: steps.scan.outputs.changed == 'true'
        run: |
          git config user.name  "fair-clustering-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Discovery: queue ${{ steps.scan.outputs.count }} candidate(s) for admin review"
          git push
