name: Refresh citations (monthly)

# Pulls current Google Scholar citation counts via SerpApi and opens a pull
# request with the deltas. Review the numbers, then merge to publish.
#
# SerpApi is used cautiously: an author-batch pass (one call returns up to 100
# of an author's papers), a staleness gate (skips recently-refreshed papers),
# and a hard per-run call budget. Tune via the env vars below.
# To skip review and commit straight to main, set OPEN_PR: "false".

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  OPEN_PR: "true"

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh citation counts
        id: refresh
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FC_MIN_AGE_DAYS: "25"     # don't re-query papers refreshed in the last 25 days
          FC_MAX_QUERIES: "200"     # hard cap on SerpApi calls per run
        run: python scripts/refresh_citations.py

      # --- Option A (default): open a PR with the citation deltas ---
      - name: Open pull request
        if: steps.refresh.outputs.changed == 'true' && env.OPEN_PR == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/citation-refresh
          title: "🔢 Monthly citation refresh (${{ steps.refresh.outputs.count }} applied, ${{ steps.refresh.outputs.flagged }} flagged)"
          body-path: citation_summary.md
          labels: citations, automated
          commit-message: "Monthly Google Scholar citation refresh"
          add-paths: |
            data/papers.json
          delete-branch: true

      # --- Option B: commit straight to main (set OPEN_PR=false to use) ---
      - name: Commit to main
        if: steps.refresh.outputs.changed == 'true' && env.OPEN_PR != 'true'
        run: |
          git config user.name  "fair-clustering-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Monthly Google Scholar citation refresh"
          git push
