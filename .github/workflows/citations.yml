name: Refresh citations (monthly)

# Pulls current Google Scholar citation counts via SerpApi and opens a pull
# request with the deltas. Review the numbers, then merge to publish.
#
# SerpApi is used cautiously: a bulk topic sweep runs first (each call returns
# 20 Scholar hits, so ~5 calls harvest ~100 papers at once), then exact
# per-paper lookups only for whatever the sweep missed — plus a staleness gate
# (skips recently-refreshed papers) and a hard per-run call budget.
# To skip review and commit straight to main, set OPEN_PR: "false".

on:
  schedule:
    # 06:00 UTC on the 5th of every month.
    - cron: "0 6 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  OPEN_PR: "true"

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh citation counts
        id: refresh
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FC_MIN_AGE_DAYS: "25"     # don't re-query papers refreshed in the last 25 days
          FC_MAX_QUERIES: "200"     # hard cap on TOTAL SerpApi calls per run
          FC_SWEEP_PAGES: "5"       # bulk sweep: 5 pages x 20 hits = ~100 papers per query
          FC_SWEEP_CALLS: "60"      # cap on the calls the bulk sweep may spend
        run: python scripts/refresh_citations.py

      # --- Option A (default): open a PR with the citation deltas ---
      - name: Open pull request
        if: steps.refresh.outputs.changed == 'true' && env.OPEN_PR == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/citation-refresh
          title: "🔢 Monthly citation refresh (${{ steps.refresh.outputs.count }} applied, ${{ steps.refresh.outputs.flagged }} flagged, ${{ steps.refresh.outputs.unmatched }} unmatched)"
          body-path: citation_summary.md
          labels: citations, automated
          commit-message: "Monthly Google Scholar citation refresh"
          add-paths: |
            data/papers.json
          delete-branch: true

      # --- Option B: commit straight to main (set OPEN_PR=false to use) ---
      - name: Commit to main
        if: steps.refresh.outputs.changed == 'true' && env.OPEN_PR != 'true'
        run: |
          git config user.name  "fair-clustering-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/papers.json
          git commit -m "Monthly Google Scholar citation refresh"
          git push
