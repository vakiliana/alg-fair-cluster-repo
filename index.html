<script>
let paperRows = []; // Make paperRows global for access in download logic

async function loadPapers() {
  const [paperResp, confResp] = await Promise.all([
    fetch('fc_papers.csv'),
    fetch('conf_names.csv')
  ]);
  paperRows = parseCSV(await paperResp.text());
  const confRows = parseCSV(await confResp.text());
  const confMap = {};
  confRows.forEach(r => {
    const slug = (r.dblp_slug || '').trim();
    const name = (r.conf_name || '').trim();
    if (slug) confMap[slug] = name || slug;
  });

  const { curr, next } = computeUpdateDates();
  document.getElementById('last-update').textContent =
    `Last update: ${formatDate(curr)} (next update scheduled on ${formatDate(next)})`;

  paperRows.sort((a, b) => parseInt(b.citations) - parseInt(a.citations));
  const container = document.getElementById('paper-list');
  const labelColors = {
    'group fairness': '#17a2b8',
    'individual fairness': '#ffc107',
    'min-max fairness': '#28a745'
  };

  paperRows.forEach(r => {
    const div = document.createElement('div');
    div.className = 'paper';

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.className = 'select-paper';
    div.appendChild(checkbox);

    // --- Add event listener to update download button text ---
    checkbox.addEventListener('change', updateDownloadButtonText);

    const content = document.createElement('div');
    content.className = 'paper-content';
    div.appendChild(content);

    const titleLink = document.createElement('a');
    titleLink.className = 'title';
    titleLink.href = r.paper_link || r.local_pdf;
    titleLink.target = '_blank';
    titleLink.textContent = r.title;

    // Create a container for title and citation on the same line
    const titleRow = document.createElement('div');
    titleRow.style.display = 'flex';
    titleRow.style.alignItems = 'baseline';
    titleRow.appendChild(titleLink);

    content.appendChild(titleRow);

    // Add extra space between title/citation line and author line
    const spacer = document.createElement('div');
    spacer.style.height = '1.1em';
    content.appendChild(spacer);

    // Always use confMap to get the conf_name from conf_names.csv
    const confSlug = parseVenueSlug(r.bib_link);
    let venueName = confMap[confSlug];
    if (!venueName) {
      venueName = confSlug || 'Unknown venue';
    }
    const year = parseYear(r.bib_link);

    const infoDiv = document.createElement('div');
    infoDiv.className = 'info';
    const authors = r.authors || 'Authors not available';
    infoDiv.innerHTML = `${authors}, <b>${venueName} ${year}</b>`;
    content.appendChild(infoDiv);

    // Add label next to report icon if present
    let labelSpan = null;
    if (r.label) {
      const lab = r.label.trim();
      if (lab) {
        labelSpan = document.createElement('span');
        labelSpan.className = 'paper-label';
        labelSpan.textContent = lab;
        const color = labelColors[lab.toLowerCase()] || '#6c757d';
        labelSpan.style.backgroundColor = color;
        // Don't append to content, append to div after icon
      }
    }

    // Use the requested icon for "report issue"
    const reportIcon = document.createElement("img");
    reportIcon.src = "https://cdn-icons-png.flaticon.com/512/595/595067.png";
    reportIcon.alt = "Report issue";
    reportIcon.title = "Report issue";
    reportIcon.className = "report-button";
    reportIcon.addEventListener("click", () => openReportModal(r.title));
    div.appendChild(reportIcon);

    if (labelSpan) {
      div.appendChild(labelSpan);
    }

    // Add citation icon and count at bottom left INSIDE .paper-content
    const citationBox = document.createElement('div');
    citationBox.className = 'citation-box';

    // Google Scholar icon (currently links to DBLP, TODO: update to Google Scholar)
    const scholarLink = document.createElement('a');
    scholarLink.href = r.bib_link || '#';
    scholarLink.target = '_blank';
    scholarLink.title = 'View on Google Scholar';
    scholarLink.innerHTML = '<i class="fa-solid fa-graduation-cap"></i>';
    citationBox.appendChild(scholarLink);

    // Citation count
    const citationCount = document.createElement('span');
    citationCount.textContent = r.citations;
    citationBox.appendChild(citationCount);

    // --- DBLP logo and link removed ---

    // Append citationBox to content, not to div
    content.appendChild(citationBox);

    container.appendChild(div);
  });

  // --- After all papers are loaded, update button text in case of reload ---
  updateDownloadButtonText();
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = splitCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue; // Skip empty lines
    const tokens = splitCSVLine(lines[i]);
    if (tokens.length !== headers.length) continue; // Skip malformed lines
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (tokens[idx] || '').trim());
    if (!obj.title && !obj.dblp_slug) continue; // Only skip if both missing
    rows.push(obj);
  }
  return rows;
}

function splitCSVLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i + 1] === '"') {
        cur += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (c === ',' && !inQuotes) {
      result.push(cur);
      cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

function parseVenueSlug(link) {
  if (!link || link === 'NONE') return '';
  const m = link.match(/rec\/(?:conf|journals)\/([^\/]+)/);
  return m ? m[1] : '';
}

function parseYear(link) {
  if (!link) return '';
  const m = link.match(/(\d{2})(?:\.bib)?$/);
  if (!m) return '';
  const y = parseInt(m[1], 10);
  return y <= 25 ? 2000 + y : 1900 + y;
}

function computeUpdateDates() {
  const now = new Date();
  const year = now.getUTCFullYear();
  const month = now.getUTCMonth();
  const first = Date.UTC(year, month, 1, 6, 0, 0);
  let curr = new Date(Date.UTC(year, month, 1));
  if (now.getTime() < first) {
    curr = new Date(Date.UTC(year, month - 1, 1));
  }
  const next = new Date(Date.UTC(curr.getUTCFullYear(), curr.getUTCMonth() + 1, 1));
  return { curr, next };
}

function formatDate(d) {
  const m = d.getUTCMonth() + 1;
  const day = d.getUTCDate();
  const y = d.getUTCFullYear();
  return `${m}/${day}/${y}`;
}

// --- Add this function to update the download button text ---
function updateDownloadButtonText() {
  const checkboxes = document.querySelectorAll('.select-paper');
  let count = 0;
  checkboxes.forEach(cb => { if (cb.checked) count++; });
  const btn = document.getElementById('download-selected');
  btn.textContent = count > 0 ? `Download (${count})` : 'Download';
}

loadPapers();

// --- Add this block to fix the Deselect All button ---
document.getElementById('deselect-all').addEventListener('click', () => {
  const checkboxes = document.querySelectorAll('.select-paper');
  checkboxes.forEach(cb => { cb.checked = false; });
  updateDownloadButtonText();
});

const modal = document.getElementById("modal");
document.getElementById("open-form").addEventListener("click", () => { modal.style.display = "block"; });
document.getElementById("close-modal").addEventListener("click", () => { modal.style.display = "none"; });
window.addEventListener("click", e => { if (e.target === modal) modal.style.display = "none"; });

document.getElementById('submit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!e.target.reportValidity()) {
    return;
  }
  const data = Object.fromEntries(new FormData(e.target).entries());
  await fetch('submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  alert('Submission received!');
  e.target.reset();
  modal.style.display = "none";
});
const reportModal = document.getElementById("report-modal");
const reportTitleInput = document.querySelector('#report-form input[name="title"]');
function openReportModal(title) {
  reportTitleInput.value = title;
  reportModal.style.display = "block";
}
document.getElementById("close-report").addEventListener("click", () => { reportModal.style.display = "none"; });
window.addEventListener("click", e => { if (e.target === reportModal) reportModal.style.display = "none"; });
document.getElementById("report-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!e.target.reportValidity()) return;
  const data = Object.fromEntries(new FormData(e.target).entries());
  await fetch("report", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  alert("Issue reported!");
  e.target.reset();
  reportModal.style.display = "none";
});

// Add a message bar for download errors
const messageBar = document.createElement('div');
messageBar.id = 'message-bar';
messageBar.style.display = 'none';
messageBar.style.position = 'fixed';
messageBar.style.top = '0';
messageBar.style.left = '0';
messageBar.style.width = '100%';

  messageBar.textContent = msg;
  messageBar.style.display = 'block';
  setTimeout(() => { messageBar.style.display = 'none'; }, 6000);
}

document.getElementById('download-selected').addEventListener('click', async () => {
  // Collect selected papers
  const checkboxes = document.querySelectorAll('.select-paper');
  const selected = [];
  checkboxes.forEach((cb, idx) => {
    if (cb.checked) selected.push(idx);
  });
  if (selected.length === 0) {
    alert('Please select at least one paper to download.');
    return;
  }

  // Find the corresponding paperRows (order is preserved)
  const selectedPapers = selected.map(idx => paperRows[idx]);
  const bibEntries = [];
  const missingTitles = [];

  for (const r of selectedPapers) {
    // Try to get the DBLP key from bib_link or paper_link
    let key = '';
    if (r.bib_link && r.bib_link.includes('dblp.org/rec/')) {
      const m = r.bib_link.match(/dblp\.org\/rec\/([^/?#]+)/);
      if (m) key = m[1].split('/').pop().replace(/\.bib$/, '');
    }
    if (!key && r.paper_link && r.paper_link.includes('dblp.org/rec/')) {
      const m = r.paper_link.match(/dblp\.org\/rec\/([^/?#]+)/);
      if (m) key = m[1].split('/').pop().replace(/\.bib$/, '');
    }
    if (!key && r.bib_link) {
      key = r.bib_link.split('/').pop().replace(/\.bib$/, '');
    }
    if (!key && r.paper_link) {
      key = r.paper_link.split('/').pop().replace(/\.bib$/, '');
    }

    // Fetch the corresponding JSON record from papers/
    let bib = '';
    if (key) {
      try {
        const resp = await fetch(`papers/${key}.json`);
        if (resp.ok) {
          const rec = await resp.json();
          bib = (rec.bib_entry || '').trim();
        }
      } catch (e) {
        // ignore fetch errors
      }
    }

    if (bib) {
      bibEntries.push(bib);
    } else {
      missingTitles.push(r.title);
    }
  }

  if (bibEntries.length === 0) {
    showMessageBar('No BibTeX entries found for the selected papers.');
    return;
  }

  if (missingTitles.length > 0) {
    showMessageBar('We could not find the BibTeX entry of: ' + missingTitles.join(', '));
  }

  // Create a .bib file and trigger download
  const bibContent = bibEntries.join('\n\n');
  const blob = new Blob([bibContent], { type: 'application/x-bibtex' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'selected_papers.bib';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

// --- Theme toggle logic ---
function setTheme(theme) {
  document.body.classList.remove('light-theme', 'dark-theme');
  document.body.classList.add(theme + '-theme');
  localStorage.setItem('theme', theme);
}
function getPreferredTheme() {
  return localStorage.getItem('theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
document.getElementById('light-theme-btn').addEventListener('click', () => setTheme('light'));
document.getElementById('dark-theme-btn').addEventListener('click', () => setTheme('dark'));
// Set initial theme on page load
setTheme(getPreferredTheme());
</script>
</body>
</html>
